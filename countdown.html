<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>処方箋の期限タイマー</title>
<style>
body {
  background: #14232e; color: #fff;
  font-family: sans-serif; text-align: center;
  padding: 60px 20px;
}
#timer {
  font-size: clamp(40px, 12vw, 80px);
  color: #ffce73; font-variant-numeric: tabular-nums;
}
p { line-height: 1.8; }
input { font-size: 18px; padding: 8px; }
</style>

<h1>処方箋の期限が切れるまで</h1>
<p>発行日：2026年10月9日（金）</p>
<div id="timer" role="timer"></div>
<p>時間 : 分 : 秒</p>

<label>
  使用期限の最終日（日本時間）
  <input id="date" type="date" value="2026-10-12">
</label>
<p id="status" aria-live="polite"></p>
<p>
  通常の日本の処方箋は発行日を含めて4日間有効です。<br>
  土日・祝日も含みます。別の使用期間が記載されていれば変更してください。<br>
  薬局の営業時間にもご注意ください。
</p>

<script>
const date = document.getElementById('date');
const timer = document.getElementById('timer');
const status = document.getElementById('status');

function update() {
  if (!date.value) {
    timer.textContent = '--:--:--';
    status.textContent = '使用期限を選んでください';
    return;
  }
  const end = Date.parse(date.value + 'T00:00:00+09:00') + 86400000;
  const seconds = Math.max(0, Math.ceil((end - Date.now()) / 1000));
  timer.textContent = [
    Math.floor(seconds / 3600),
    Math.floor(seconds % 3600 / 60),
    seconds % 60
  ].map(n => String(n).padStart(2, '0')).join(':');

  status.textContent = seconds === 0
    ? '使用期限が切れました。発行元の医療機関にご相談ください。'
    : date.value + ' いっぱいまで有効（日本時間）';
}
date.addEventListener('input', update);
update();
setInterval(update, 1000);
</script>
</html>
